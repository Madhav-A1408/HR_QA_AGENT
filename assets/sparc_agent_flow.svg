<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" width="1100" height="770" role="img" aria-labelledby="t d" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sparc HR Q&amp;A agent flow</title>
  <desc id="d">An employee question goes to a triage router. Off-topic questions get a polite reply and end. HR questions go to the response agent, where an LLM picks one tool at a time; code guards check each tool call. search_policy_docs and check_employee_record return results to the LLM. Question asks the employee one clarifying question and ends the turn; the reply starts a new turn. Done sends the final answer with sources.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gEmp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <linearGradient id="gRouter" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="gLLM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="gGuard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="gSearch" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="gRecord" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="gQuestion" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#be185d"/></linearGradient>
    <linearGradient id="gDone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="context-stroke"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#e2e8f0"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#67e8f9"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#f9a8d4"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#86efac"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <!-- background -->
  <rect width="1100" height="770" rx="24" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="52" font-size="28" font-weight="700" fill="#ffffff">Sparc <tspan fill="#a5b4fc" font-weight="400">· HR Q&amp;A Agent</tspan></text>
  <text x="40" y="80" font-size="14" fill="#94a3b8">How an employee's question flows through the LangGraph agent</text>

  <!-- employee -->
  <g filter="url(#sh)"><rect x="30" y="250" width="140" height="90" rx="18" fill="url(#gEmp)"/></g>
  <text x="100" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Employee</text>
  <text x="100" y="308" text-anchor="middle" font-size="13" fill="#fde2f0">asks a question</text>
  <text x="100" y="326" text-anchor="middle" font-size="11" fill="#fbcfe8">(chat.py)</text>

  <line x1="170" y1="295" x2="210" y2="295" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#aw)"/>

  <!-- triage router -->
  <g filter="url(#sh)"><rect x="215" y="200" width="200" height="190" rx="20" fill="url(#gRouter)"/></g>
  <text x="315" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1917">Triage Router</text>
  <rect x="270" y="252" width="90" height="26" rx="13" fill="#1c1917" opacity="0.85"/>
  <text x="315" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#fde68a">LLM step</text>
  <text x="315" y="302" text-anchor="middle" font-size="12" fill="#292524">structured output decides:</text>
  <text x="315" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1917">answer  |  ignore</text>
  <text x="315" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1917">general  |  personal</text>

  <!-- ignore branch -->
  <line x1="315" y1="390" x2="315" y2="462" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#aw)"/>
  <text x="325" y="430" font-size="13" font-weight="600" fill="#fca5a5">ignore</text>
  <g filter="url(#sh)"><rect x="225" y="466" width="180" height="70" rx="16" fill="#334155" stroke="#64748b"/></g>
  <text x="315" y="496" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Polite off-topic reply</text>
  <text x="315" y="518" text-anchor="middle" font-size="12" fill="#cbd5e1">→ End</text>

  <!-- answer branch into agent -->
  <path d="M415 295 H484 V320 H502" fill="none" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#aw)"/>
  <text x="420" y="284" font-size="13" font-weight="600" fill="#86efac">answer</text>

  <!-- response agent panel -->
  <rect x="470" y="100" width="600" height="560" rx="24" fill="#6366f1" fill-opacity="0.10" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="495" y="132" font-size="19" font-weight="700" fill="#e0e7ff">Response Agent</text>
  <text x="495" y="152" font-size="12" fill="#a5b4fc">loops until it calls Done or Question</text>

  <!-- agent LLM -->
  <g filter="url(#sh)"><circle cx="560" cy="320" r="54" fill="url(#gLLM)"/></g>
  <text x="560" y="314" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Agent LLM</text>
  <text x="560" y="334" text-anchor="middle" font-size="11.5" fill="#ede9fe">picks one tool</text>

  <!-- guard box -->
  <line x1="614" y1="320" x2="626" y2="320" stroke="#e2e8f0" stroke-width="2.5"/>
  <g filter="url(#sh)"><rect x="626" y="288" width="128" height="64" rx="14" fill="url(#gGuard)"/></g>
  <text x="690" y="314" text-anchor="middle" font-size="13.5" font-weight="700" fill="#022c22">tool_node</text>
  <text x="690" y="334" text-anchor="middle" font-size="11.5" fill="#064e3b">runs + code guards</text>

  <!-- bus -->
  <line x1="754" y1="320" x2="770" y2="320" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="770" y1="232" x2="770" y2="508" stroke="#e2e8f0" stroke-width="2.5"/>
  <line x1="770" y1="232" x2="786" y2="232" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#aw)"/>
  <line x1="770" y1="316" x2="786" y2="316" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#aw)"/>
  <line x1="770" y1="412" x2="786" y2="412" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#aw)"/>
  <line x1="770" y1="508" x2="786" y2="508" stroke="#e2e8f0" stroke-width="2.5" marker-end="url(#aw)"/>

  <!-- tool cards -->
  <g filter="url(#sh)"><rect x="790" y="200" width="255" height="64" rx="14" fill="url(#gSearch)"/></g>
  <text x="806" y="226" font-size="15" font-weight="700" fill="#fff">search_policy_docs</text>
  <text x="806" y="248" font-size="11.5" fill="#cffafe">Vector search of the HR handbook</text>

  <g filter="url(#sh)"><rect x="790" y="284" width="255" height="64" rx="14" fill="url(#gRecord)"/></g>
  <text x="806" y="310" font-size="15" font-weight="700" fill="#fff">check_employee_record</text>
  <text x="806" y="332" font-size="11.5" fill="#dbeafe">Reads one field of the asker's record</text>

  <g filter="url(#sh)"><rect x="790" y="380" width="255" height="64" rx="14" fill="url(#gQuestion)"/></g>
  <text x="806" y="406" font-size="15" font-weight="700" fill="#fff">Question</text>
  <text x="806" y="428" font-size="11.5" fill="#fce7f3">Asks one clarifying question (e.g. ID)</text>

  <g filter="url(#sh)"><rect x="790" y="476" width="255" height="64" rx="14" fill="url(#gDone)"/></g>
  <text x="806" y="502" font-size="15" font-weight="700" fill="#fff">Done</text>
  <text x="806" y="524" font-size="11.5" fill="#dcfce7">Final answer + sources, or "contact HR"</text>

  <!-- tool results back to LLM -->
  <path d="M1045 316 H1058 V232" fill="none" stroke="#67e8f9" stroke-width="2"/>
  <path d="M1045 232 H1058 V176 H560 V262" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#ac)"/>
  <text x="820" y="168" font-size="12" font-weight="600" fill="#67e8f9">tool result goes back to the LLM</text>

  <!-- done -> end -->
  <line x1="917" y1="540" x2="917" y2="582" stroke="#86efac" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="822" y="586" width="190" height="44" rx="22" fill="#14532d" stroke="#4ade80"/>
  <text x="917" y="613" text-anchor="middle" font-size="13" font-weight="700" fill="#bbf7d0">End · reply shown</text>

  <!-- code guards box -->
  <rect x="495" y="400" width="252" height="112" rx="16" fill="#064e3b" fill-opacity="0.55" stroke="#34d399"/>
  <text x="511" y="424" font-size="13.5" font-weight="700" fill="#6ee7b7">Code guards (rules in Python)</text>
  <text x="511" y="446" font-size="11.5" fill="#d1fae5">• lookups only with an ID they typed</text>
  <text x="511" y="465" font-size="11.5" fill="#d1fae5">• personal answers need the record first</text>
  <text x="511" y="484" font-size="11.5" fill="#d1fae5">• the deciding field (e.g. Gender) is read</text>
  <text x="511" y="503" font-size="11.5" fill="#d1fae5">  before answering</text>

  <!-- data box -->
  <rect x="495" y="528" width="252" height="102" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#475569"/>
  <text x="511" y="552" font-size="13.5" font-weight="700" fill="#e2e8f0">Data the tools read</text>
  <circle cx="517" cy="574" r="5" fill="#06b6d4"/>
  <text x="530" y="578" font-size="11.5" fill="#cbd5e1">policy_corpus.json → ChromaDB index</text>
  <circle cx="517" cy="598" r="5" fill="#3b82f6"/>
  <text x="530" y="602" font-size="11.5" fill="#cbd5e1">employee_records.json</text>
  <text x="511" y="620" font-size="10.5" fill="#94a3b8">21 policies in 7 handbook sections</text>

  <!-- question -> next turn -->
  <path d="M1045 412 H1062 V690 H100 V346" fill="none" stroke="#f9a8d4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ap)"/>
  <text x="580" y="710" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f9a8d4">Question ends the turn → the employee replies (e.g. their ID) → a new turn starts, with the chat history</text>

  <!-- legend -->
  <circle cx="48" cy="744" r="7" fill="url(#gLLM)"/><text x="62" y="748" font-size="12" fill="#94a3b8">LLM step</text>
  <rect x="140" y="737" width="14" height="14" rx="4" fill="url(#gGuard)"/><text x="162" y="748" font-size="12" fill="#94a3b8">checked in code</text>
  <line x1="276" y1="744" x2="304" y2="744" stroke="#67e8f9" stroke-width="2" marker-end="url(#ac)"/><text x="312" y="748" font-size="12" fill="#94a3b8">tool result</text>
  <line x1="398" y1="744" x2="426" y2="744" stroke="#f9a8d4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ap)"/><text x="434" y="748" font-size="12" fill="#94a3b8">next turn</text>
  <text x="1060" y="748" text-anchor="end" font-size="11" fill="#64748b">No human-approval step yet</text>
</svg>
